<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>SakuKost - User Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="main-layout">
    <nav class="sidebar">
        <h3>SakuKost User</h3>
        <ul>
            <li onclick="showPage('user-home')">Beranda</li>
            <li onclick="showPage('user-bayar')">Pembayaran</li>
            <li onclick="showPage('user-lapor')">Lapor Fasilitas</li>
            <li class="logout" onclick="logout()">Keluar</li>
        </ul>
    </nav>
    <main class="content">
        <div id="user-home" class="page">
            <h1>Selamat Datang!</h1>
            <div class="card">
                <h4>Informasi Sewa</h4>
                <p>No Kamar: A03</p>
                <p>Status: <span class="status-ok">Penghuni Aktif</span></p>
            </div>
        </div>
        <div id="user-bayar" class="page" style="display:none;">
            <h1>Kirim Bukti Pembayaran</h1>
            <div class="form-container">
                <label>Bulan Pembayaran</label>
                <input type="month">
                <label>File Bukti</label>
                <input type="file">
                <button class="btn-acc" onclick="alert('Berhasil Terkirim')">Kirim</button>
            </div>
        </div>
        <div id="user-lapor" class="page" style="display:none;">
            <h1>Lapor Fasilitas</h1>
            <div class="form-container">
                <label>Fasilitas</label>
                <input type="text" placeholder="Nama Fasilitas">
                <label>Detail Keluhan</label>
                <textarea rows="4" placeholder="Jelaskan masalah..."></textarea>
                <button class="btn-deny" onclick="alert('Laporan Terkirim!')">Kirim</button>
            </div>
        </div>
    </main>
</div>
<script src="script.js"></script>
</body>
</html>
